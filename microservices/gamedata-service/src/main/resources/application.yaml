spring:
  grpc:
    server:
      port: 9096
      servlet:
        enabled: false
  application:
    name: gamedata-service
  datasource:
    url: jdbc:postgresql://localhost:5432/gamedata_db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
server:
  port: 9092