syntax = "proto3";

package gameSessionService;

option java_multiple_files = true;
option java_package = "com.dungeoncrawler.contracts.grpc.gamesession";

service GameSessionService {
  rpc JoinSession(JoinRequest) returns (JoinResponse);
}

message JoinRequest {
  string session_id = 1;
  string template_id = 2;
  string username = 3;
  string userId = 4;
}

message JoinResponse {
  bool success = 1;
  string error_message = 2;
}