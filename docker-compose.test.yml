version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 5

  gamesession-service:
    build:
      context: .
      dockerfile: ./microservices/gamesession-service/Dockerfile
    ports:
      - "9091:9091"
    depends_on:
      - kafka
    environment:
      - SERVER_PORT=9091
      - SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS=kafka:29092
      - GRPC_SERVER_PORT=9091

  websocket-service:
    build:
      context: .
      dockerfile: ./microservices/websocket-service/Dockerfile
    depends_on:
      - kafka
      - gamesession-service
    ports:
      - "9090:9090"
    environment:
      - SERVER_PORT=9090
      - SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS=kafka:29092
      - GRPC_CLIENTS_GAMESESSION-SERVICE_ADDRESS=gamesession-service:9091